services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URI: mongodb://mongodb:27017/local-pm
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-pm-secret-key-for-development-only}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3010}
    container_name: local-pm-app
    restart: unless-stopped
    ports:
      # ADR-001/D1: loopback-only binding in local mode. Public exposure,
      # if ever needed, is added exclusively as a reverse-proxy layer.
      - "127.0.0.1:3010:3010"
    environment:
      DATABASE_URI: mongodb://mongodb:27017/local-pm
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-pm-secret-key-for-development-only}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3010}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: local-pm-mongodb
    restart: unless-stopped
    # ADR-001/D1 + REQ-001.2: no host port publishing — reachable only via the
    # compose internal network (app -> mongodb:27017). Host-side inspection,
    # if needed, goes through `docker exec` or an explicit 127.0.0.1 publish.
    volumes:
      - local-pm-mongodb-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: local-pm

volumes:
  local-pm-mongodb-data:
