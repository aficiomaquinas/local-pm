# Minimal dex (dexidp) IdP config — EXAMPLE for the future OD-4 E2E overlay.
#
# NOT used by `docker compose build` / `up` by default. It is mounted by
# docker-compose.oidc.yml (opt-in) and exists so the OIDC E2E milestone
# (SPC-006: "E2E IdP pending") has a working local IdP to run against.
#
# Image this config targets: ghcr.io/dexidp/dex:v2.45.1
#   docker run --rm -v "$PWD/config/dex:/etc/dex:ro" \
#     ghcr.io/dexidp/dex:v2.45.1 dex serve /etc/dex/config.yml  # dry check

# The canonical URL all clients MUST use to refer to dex. Kept on the
# in-network hostname `dex` so the app container's server-to-server calls
# (discovery, token, JWKS) resolve via the compose network. The BROWSER leg
# needs the operator host to resolve the same name: add `127.0.0.1 dex` to
# /etc/hosts (dex's port is published loopback-only, see the overlay).
issuer: http://dex:5556/dex

# In-memory storage: state lives for the dex process only — the E2E stack
# is disposable by design (nothing to back up, nothing to migrate).
storage:
  type: memory

web:
  http: 0.0.0.0:5556

# Built-in email/password connector ("local" user database) — no external
# connector needed for the E2E login flow.
enablePasswordDB: true

oauth2:
  # client_credentials is OPT-IN in dex (PR #4583). VERIFIED LIVE against
  # v2.45.1 (2026-09-10): this release DOES NOT ship that PR yet — the entry
  # below is accepted but inert (discovery omits client_credentials, token
  # endpoint answers 400 unsupported_grant_type). Keep it: it activates the
  # MCP leg as soon as a dex release carries #4583 — pin the image tag in
  # docker-compose.oidc.yml to that release. Until then, an m2m E2E needs
  # either a dex build from the PR branch or a different IdP for that leg.
  grantTypes:
    - authorization_code
    - client_credentials

staticClients:
  # The web app: confidential client, authorization_code + PKCE (S256).
  # redirectURIs must match getRedirectUri() exactly =
  # ${NEXT_PUBLIC_SERVER_URL}/api/auth/oidc/callback (SPC-006 §13); both
  # loopback spellings are pre-registered for operator convenience.
  - id: local-pm-web
    redirectURIs:
      - "http://localhost:3010/api/auth/oidc/callback"
      - "http://127.0.0.1:3010/api/auth/oidc/callback"
    name: "local-pm web"
    secret: web-secret-dev-only

  # The MCP server: confidential client for the machine-to-machine
  # client_credentials grant (SPC-006 §6/§10). No redirectURIs: the grant
  # has none (RFC 6749 §4.4).
  - id: local-pm-mcp
    name: "local-pm MCP server"
    secret: mcp-secret-dev-only

# Dev-only login: ops@local.test / ops-password (hash of that literal, cost
# 10 — regenerated for this file; NEVER reuse outside a disposable stack).
staticPasswords:
  - email: "ops@local.test"
    hash: "$2a$10$hqE9.Uv8hQV9cZuDtHuyju4QCU0eYeDeXCp4sgD6rMNwUj0Z1mlOC"
    username: "ops"
    name: "Ops User"
    emailVerified: true
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
    groups:
      - "local-pm-humans"
      - "local-pm-admins"
