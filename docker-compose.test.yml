# SPC-004 verification stack (never used for the production deployment).
#
# Overlays docker-compose.yml for an isolated spine-verification stack:
#   - different container names (the base file pins them; `-p` alone does
#     not lift that)
#   - NO host port publishing at all: every check runs from inside the
#     network via `docker exec` (curl against localhost:3010 in-container)
#   - snapshot files land on the dedicated local-pm-snapshots volume (D-3)
#
#   docker compose -p local-pm-test \
#     -f docker-compose.yml -f docker-compose.test.yml up -d --build
#   docker compose -p local-pm-test \
#     -f docker-compose.yml -f docker-compose.test.yml down --volumes
#
# The builder stage runs the full test suite (SPC-003 §5.3): a red suite
# breaks this build.
services:
  app:
    container_name: local-pm-test-app
    ports: !reset []

  mongodb:
    container_name: local-pm-test-mongodb
